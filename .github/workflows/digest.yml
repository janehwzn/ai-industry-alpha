name: AI Infra Daily Digest

on:
  schedule:
    # Mon–Fri 14:15 UTC = 7:15 AM PDT (6:15 AM during PST)
    - cron: "15 14 * * 1-5"
  workflow_dispatch:
    inputs:
      days:
        description: "Lookback days"
        default: "1"

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch and generate digest
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DAYS="${{ inputs.days }}"
          elif [ "$(date -u +%u)" = "1" ]; then
            DAYS=3
          else
            DAYS=1
          fi
          python3 fetch.py --days "$DAYS"
          python3 render_html.py --days "$DAYS"

      - name: Send email
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT: ${{ secrets.RECIPIENT }}
        run: |
          MD=$(ls -t digests/*.md | head -1)
          HTML="${MD%.md}.html"
          python3 send_email.py "$MD" --html "$HTML"

      - name: Upload digest archive
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ github.run_id }}
          path: |
            digests/*.md
            digests/*.html
