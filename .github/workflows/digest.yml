name: AI Infra Daily Digest

on:
  schedule:
    # 周一至周五 14:15 UTC = 7:15 AM PDT (PST 期间为 6:15 AM)
    - cron: "15 14 * * 1-5"
  workflow_dispatch:
    inputs:
      days:
        description: "回看天数"
        default: "1"

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 抓取并生成 digest
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DAYS="${{ inputs.days }}"
          elif [ "$(date -u +%u)" = "1" ]; then
            DAYS=3
          else
            DAYS=1
          fi
          python3 fetch.py --days "$DAYS"

      - name: 发送邮件
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT: ${{ secrets.RECIPIENT }}
        run: |
          FILE=$(ls -t digests/*.md | head -1)
          python3 send_email.py "$FILE"

      - name: 上传 digest 存档
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ github.run_id }}
          path: digests/*.md
