name: Deploy site

# Builds the AI Industry Alpha website (site/) and deploys it to GitHub Pages.
# Runs when the site code or its data inputs change. The digest pipeline
# (digest.yml) refreshes data/archive.jsonl Mon–Fri, which retriggers this.
#
# One-time setup: repo Settings > Pages > Build and deployment > Source:
# "GitHub Actions". Then the site is live at
# https://janehwzn.github.io/ai-industry-alpha/ (until aialpha.news is connected).

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'website-seed.json'
      - 'data/archive.jsonl'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build site data
        run: python3 site/scripts/build-data.py

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install and build
        working-directory: site
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_STRIPE_PRICE_MONTHLY: ${{ secrets.VITE_STRIPE_PRICE_MONTHLY }}
          VITE_STRIPE_PRICE_ANNUAL: ${{ secrets.VITE_STRIPE_PRICE_ANNUAL }}
        run: |
          npm ci
          npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
